name: Criar APK para Android

on:
  push:
    branches: [ principal, main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias do Sistema e Android SDK (AIDL)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev android-sdk build-essential

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Aceitar Licencas do SDK
        run: |
          yes | buildozer android status || true

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: casa-inteligente-apk
          path: bin/*.apk