[app]

# (str) Title of your application
title = Casa Inteligente

# (str) Package name
package.name = casainteligente

# (str) Package domain (needed for android/ios packaging)
package.domain = org.casainteligente

# (str) Source code where the main.py live
source.dir = .

# (list) Source files to include (include icone.png)
source.include_exts = py,png,jpg,kv,atlas

# (list) List of inclusions using pattern matching
source.include_patterns = assets/*,*.png

# (str) Application versioning
version = 1.0.0

# (list) Application requirements
# Requests e urllib3 sao necessarios para comunicacao HTTP com o ESP32
requirements = python3,kivy,requests,urllib3,chardet,idna,certifi

# (str) Custom source folders for requirements
# requirements.source.kivy = ../kivy

# (str) Icon of the application
icon.filename = %(source.dir)s/icone.png

# (str) Supported orientation (landscape, sensorLandscape, portrait or all)
orientation = portrait

# (bool) Indicate if the application should be fullscreen or not
fullscreen = 0

# (list) Permissions
# Internet e permissao de rede sao essenciais para falar com o ESP32
android.permissions = INTERNET,ACCESS_NETWORK_STATE,ACCESS_WIFI_STATE

# (int) Target Android API, should be as high as possible.
android.api = 33

# (int) Minimum API required
android.minapi = 21

# (int) Android NDK version to use
android.ndk = 25b

# (bool) If True, then skip trying to update the Android sdk
android.skip_update = False

# (bool) If True, then automatically accept SDK licenses
android.accept_sdk_license = True

# (str) The Android arch to build for
android.archs = arm64-v8a, armeabi-v7a

# (bool) enable Android logcat
android.logcat_filters = *:S python:D

[buildozer]

# (int) Log level (0 = error only, 1 = info, 2 = debug (with command output))
log_level = 2

# (int) Display warning if buildozer is run as root (0 = False, 1 = True)
warn_on_root = 1