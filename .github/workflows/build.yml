name: Criar APK para Android

on:
  push:
    branches: [ principal, main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias do Sistema
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Aceitar Licencas do Android SDK
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf "24333f8a637b3a44d31082e56f747789af4e4ff9\nd58f5736fb93192f03e4811630013e48d9e9f122\n84831b9409646a4d8f22ac7540f3b72c4bfa3586" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          yes | buildozer android status || true

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: casa-inteligente-apk
          path: bin/*.apk